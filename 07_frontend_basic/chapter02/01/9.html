<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        ul::before {
            content: "안녕 나는 까마귀";
        }

        ul::after {
            content: "까마귀는 떠나볼게~";
        }

        textarea::placeholder {
            color: red;
        }
        .text::selection{
            background: yellow;
        }
    </style>
    <ul>
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
    </ul>

    <textarea placeholder="자기소개를 입력하세요..."></textarea>

    <div class="text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores labore consequuntur nobis
        quaerat placeat excepturi dolorem voluptatibus quia temporibus explicabo, delectus omnis vero tempora! Molestias
        rerum exercitationem velit nihil voluptate.</div>
</body>

</html>
